version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python3 -m venv /tmp/authority-delta-gate-b-env
      - /tmp/authority-delta-gate-b-env/bin/python -m pip install --no-index --find-links vendor/analysis/x86_64 --require-hashes -r requirements-analysis-x86_64.lock
  build:
    commands:
      - PYTHONPATH=src /tmp/authority-delta-gate-b-env/bin/python scripts/gate_b.py
